# Grimoire book configuration for the @deckyard/anthropic documentation.

[book]
title = "@deckyard/anthropic"
description = "A client for Anthropic's Claude Messages API: tool use, thinking, prompt caching, token counting and message batches"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-anthropic/"
repoUrl = "https://github.com/deckyard/deck-anthropic"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-anthropic/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
